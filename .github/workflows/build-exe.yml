
name: Build Windows exe

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "matrix_ops.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/build-exe.yml"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v1.0.1)"
        required: true
        type: string
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows executable
        run: >
          pyinstaller --noconfirm --clean --noconsole --onefile
          --name COGNIX-ImageLab
          --icon assets/COGNIX.ico
          --collect-all customtkinter
          --collect-all PIL
          --collect-all numpy
          --hidden-import PIL._tkinter_finder
          --add-data "assets;assets"
          main.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: COGNIX-ImageLab-Windows
          path: dist/COGNIX-ImageLab.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: COGNIX Image Lab ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/COGNIX-ImageLab.exe
          fail_on_unmatched_files: true
